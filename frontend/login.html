<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ingreso — Gestión Humana</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0b0d14;
  --surface:  #12151f;
  --surface2: #181c2a;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.12);
  --text:     #dde1ef;
  --muted:    #555d78;
  --accent:   #7c6af7;
  --accent2:  #6366f1;
  --danger:   #f87171;
}

html, body {
  height: 100%; min-height: 100vh;
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

/* ── BACKGROUND DECORATION ── */
.bg-glow {
  position: fixed; border-radius: 50%;
  pointer-events: none; z-index: 0;
}
.bg-glow-1 {
  width: 600px; height: 600px;
  top: -200px; left: -150px;
  background: radial-gradient(circle, rgba(124,106,247,0.06) 0%, transparent 70%);
}
.bg-glow-2 {
  width: 500px; height: 500px;
  bottom: -150px; right: -100px;
  background: radial-gradient(circle, rgba(99,102,241,0.05) 0%, transparent 70%);
}
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* ── CARD ── */
.login-card {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 40px 36px;
  animation: slideUp 0.45s cubic-bezier(0.16,1,0.3,1) forwards;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── HEADER ── */
.login-logo {
  display: flex; align-items: center; gap: 12px; margin-bottom: 32px;
}
.logo-badge {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.82rem; font-weight: 700; color: #fff;
  flex-shrink: 0;
  box-shadow: 0 0 0 6px rgba(124,106,247,0.12);
}
.logo-text h1 {
  font-size: 0.95rem; font-weight: 700; color: #fff;
  letter-spacing: -0.02em; line-height: 1;
}
.logo-text p {
  font-size: 0.62rem; color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.08em; text-transform: uppercase; margin-top: 3px;
}

.login-headline {
  margin-bottom: 28px;
}
.login-headline h2 {
  font-size: 1.55rem; font-weight: 800; color: #fff;
  letter-spacing: -0.04em; line-height: 1.15;
}
.login-headline p {
  font-size: 0.72rem; color: var(--muted);
  margin-top: 6px; line-height: 1.5;
  font-family: 'JetBrains Mono', monospace;
}

/* ── FORM ── */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label {
  font-size: 0.68rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  font-family: 'JetBrains Mono', monospace;
}
.input-wrap { position: relative; }
.input-wrap svg {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--muted); pointer-events: none;
  flex-shrink: 0;
}
.input-wrap input {
  width: 100%; padding: 10px 14px 10px 38px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px;
  font-family: 'Syne', sans-serif; font-size: 0.85rem;
  outline: none; transition: border-color 0.2s, background 0.2s;
}
.input-wrap input:focus {
  border-color: rgba(124,106,247,0.5);
  background: rgba(124,106,247,0.06);
}
.input-wrap input::placeholder { color: var(--muted); }

/* eye toggle for password */
.eye-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 2px;
  color: var(--muted); display: flex; align-items: center;
  transition: color 0.2s;
}
.eye-btn:hover { color: var(--text); }
.eye-btn svg { width: 16px; height: 16px; pointer-events: none; }

/* ── ERROR ── */
.error-msg {
  display: none;
  background: rgba(248,113,113,0.1);
  border: 1px solid rgba(248,113,113,0.25);
  color: var(--danger);
  border-radius: 8px; padding: 9px 12px;
  font-size: 0.72rem; font-family: 'JetBrains Mono', monospace;
  margin-bottom: 16px;
  animation: shake 0.35s cubic-bezier(0.36,.07,.19,.97);
}
.error-msg.visible { display: flex; align-items: center; gap: 8px; }
@keyframes shake {
  10%,90%  { transform: translateX(-2px); }
  20%,80%  { transform: translateX(4px); }
  30%,50%,70% { transform: translateX(-4px); }
  40%,60%  { transform: translateX(4px); }
}

/* ── SUBMIT ── */
.btn-login {
  width: 100%; padding: 12px;
  background: var(--accent);
  color: #fff; border: none;
  border-radius: 10px;
  font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700;
  cursor: pointer; letter-spacing: 0.01em;
  transition: opacity 0.2s, transform 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 20px rgba(124,106,247,0.3);
  margin-top: 4px;
}
.btn-login:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
.btn-login:active:not(:disabled) { transform: translateY(0); }
.btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-login svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ── SPINNER ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.75s linear infinite; }

/* ── FOOTER ── */
.login-footer {
  margin-top: 24px; padding-top: 18px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.login-footer p {
  font-size: 0.6rem; color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.06em;
}
.version-badge {
  background: rgba(124,106,247,0.12); border: 1px solid rgba(124,106,247,0.2);
  color: var(--accent); padding: 3px 8px; border-radius: 20px;
  font-size: 0.6rem; font-family: 'JetBrains Mono', monospace;
}

/* ── EMPRESA PREVIEW ── */
.empresa-preview {
  display: none;
  background: rgba(52,211,153,0.07);
  border: 1px solid rgba(52,211,153,0.2);
  border-radius: 8px; padding: 8px 12px;
  margin-bottom: 16px;
  align-items: center; gap: 10px;
}
.empresa-preview.visible { display: flex; }
.empresa-preview-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #34d399; flex-shrink: 0;
  animation: pulse 2s ease infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
  50% { box-shadow: 0 0 0 5px rgba(52,211,153,0); }
}
.empresa-preview-text {
  font-size: 0.68rem; font-family: 'JetBrains Mono', monospace;
  color: #34d399;
}
</style>
</head>
<body>

<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-grid"></div>

<div class="login-card">

  <!-- Logo -->
  <div class="login-logo">
    <div class="logo-badge" id="logo-badge">9B</div>
    <div class="logo-text">
      <h1 id="empresa-nombre">9-Box Grid</h1>
      <p>Gestión Humana · Evaluación de Talento</p>
    </div>
  </div>

  <!-- Headline -->
  <div class="login-headline">
    <h2>Bienvenido<br/>de vuelta</h2>
    <p>Ingresa tus credenciales para continuar</p>
  </div>

  <!-- Empresa detectada -->
  <div class="empresa-preview" id="empresa-preview">
    <div class="empresa-preview-dot"></div>
    <span class="empresa-preview-text" id="empresa-preview-text"></span>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error-msg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="error-text">Usuario o contraseña incorrectos</span>
  </div>

  <!-- Form -->
  <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off" novalidate>

    <div class="field">
      <label for="username">Usuario</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" placeholder="tu.usuario" autocomplete="username" oninput="onUsernameInput(this.value)"/>
      </div>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
        <button type="button" class="eye-btn" id="eye-btn" onclick="togglePassword()" aria-label="Mostrar contraseña">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login" id="btn-login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Ingresar
    </button>

  </form>

  <div class="login-footer">
    <p>© 2025 Gestión Humana</p>
    <span class="version-badge">v1.0</span>
  </div>

</div>

<!-- clients.js SIEMPRE antes del script de login -->
<script src="clients.js"></script>
<script>

/* Si ya hay sesión activa → ir directo al 9-box */
(function() {
  try {
    const s = getSession();
    if (s) {
      console.log("[login] Sesión activa encontrada, redirigiendo a index.html...", s.username);
      window.location.replace("index.html");
    }
  } catch(e) {
    console.error("[login] Error verificando sesión:", e);
  }
})();

let pwVisible = false;

function togglePassword() {
  pwVisible = !pwVisible;
  const inp = document.getElementById("password");
  inp.type = pwVisible ? "text" : "password";
  document.getElementById("eye-icon").innerHTML = pwVisible
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}

/* Preview de empresa mientras escribe el usuario */
function onUsernameInput(val) {
  const preview  = document.getElementById("empresa-preview");
  const previewT = document.getElementById("empresa-preview-text");
  const user = val.trim().toLowerCase();

  if (!user) { preview.classList.remove("visible"); return; }

  /* Busca en todos los clientes si el usuario existe */
  for (const client of CLIENTS) {
    const found = client.usuarios.find(u => u.username.toLowerCase() === user);
    if (found) {
      previewT.textContent = client.nombre;
      preview.classList.add("visible");
      /* Ajusta color del badge al color del cliente */
      document.getElementById("logo-badge").style.background = client.color;
      document.getElementById("empresa-nombre").textContent = client.nombre;
      return;
    }
  }
  preview.classList.remove("visible");
  document.getElementById("logo-badge").style.background = "";
  document.getElementById("empresa-nombre").textContent = "9-Box Grid";
}

function showError(msg) {
  const el = document.getElementById("error-msg");
  document.getElementById("error-text").textContent = msg;
  el.classList.remove("visible");
  void el.offsetWidth;  /* re-trigger animation */
  el.classList.add("visible");
}

function setLoading(on) {
  const btn = document.getElementById("btn-login");
  btn.disabled = on;
  btn.innerHTML = on
    ? `<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Verificando...`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Ingresar`;
}

function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !password) {
    showError("Completa usuario y contraseña");
    return;
  }

  setLoading(true);

  /* Pequeño delay para que se vea el spinner */
  setTimeout(() => {
    try {
      const result = authenticate(username, password);
      console.log("[login] Resultado autenticación:", result.ok, result.error || "");

      if (result.ok) {
        saveSession(result.session);
        console.log("[login] Sesión guardada. Redirigiendo...");
        // Verificar que se guardó bien
        const check = getSession();
        console.log("[login] Verificación sesión guardada:", check ? "OK ✅" : "FALLÓ ❌");
        window.location.replace("index.html");
      } else {
        showError(result.error || "Credenciales incorrectas");
        setLoading(false);
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
      }
    } catch(e) {
      console.error("[login] Error en handleLogin:", e);
      showError("Error interno: " + e.message);
      setLoading(false);
    }
  }, 600);
}

/* Enter en el campo de usuario mueve al password */
document.getElementById("username").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); document.getElementById("password").focus(); }
});

</script>
</body>
</html>
